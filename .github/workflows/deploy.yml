# Builds the site and publishes it to GitHub Pages every time the main branch changes.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # A project site lives at /<repo-name>/; a <user>.github.io repo lives at the root
      - name: Set the site's address
        run: |
          name="${{ github.event.repository.name }}"
          if [[ "$name" == *.github.io ]]; then echo "BASE_PATH=" >> "$GITHUB_ENV"; else echo "BASE_PATH=/$name" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
